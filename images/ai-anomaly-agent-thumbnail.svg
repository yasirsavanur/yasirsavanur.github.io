<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">KPI Anomaly Detection and Alerting</title>
  <desc id="desc">A dashboard-style illustration showing KPI monitoring, anomaly detection, automated alerts and business analytics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1628"/>
      <stop offset="1" stop-color="#17365d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16243a"/>
      <stop offset="1" stop-color="#203b5d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="170" fill="#2c7be5" opacity="0.08"/>
  <circle cx="95" cy="615" r="160" fill="#65c18c" opacity="0.06"/>

  <text x="70" y="90" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">KPI Anomaly Detection</text>
  <text x="70" y="132" fill="#afc4dc" font-family="Arial, Helvetica, sans-serif" font-size="24">Statistical Monitoring &amp; Automated Alerting</text>

  <rect x="70" y="180" width="720" height="405" rx="22" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="105" y="225" fill="#dce8f5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Revenue vs 7-Day Baseline</text>
  <line x1="110" y1="515" x2="750" y2="515" stroke="#8197ad" stroke-opacity="0.45" stroke-width="2"/>
  <line x1="110" y1="275" x2="110" y2="515" stroke="#8197ad" stroke-opacity="0.45" stroke-width="2"/>
  <line x1="110" y1="390" x2="750" y2="390" stroke="#8197ad" stroke-opacity="0.20" stroke-dasharray="8 9"/>
  <polyline points="115,465 170,444 225,451 280,418 335,429 390,400 445,413 500,377 555,390 610,348 665,365 720,286" fill="none" stroke="#56a8ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="115,452 170,447 225,439 280,431 335,420 390,412 445,402 500,394 555,387 610,378 665,370 720,360" fill="none" stroke="#a9b9ca" stroke-width="4" stroke-dasharray="12 11" opacity="0.8"/>
  <circle cx="720" cy="286" r="13" fill="#ff6b6b"/>
  <circle cx="720" cy="286" r="25" fill="none" stroke="#ff6b6b" stroke-width="4" opacity="0.38"/>
  <text x="548" y="267" fill="#ffb3b3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">ANOMALY DETECTED</text>

  <rect x="835" y="180" width="295" height="190" rx="22" fill="#f7f9fc" filter="url(#shadow)"/>
  <circle cx="887" cy="231" r="27" fill="#ff6b6b"/>
  <text x="878" y="241" fill="#fff" font-family="Arial" font-size="28" font-weight="700">!</text>
  <text x="925" y="226" fill="#132238" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Critical Alert</text>
  <text x="870" y="278" fill="#40546b" font-family="Arial, Helvetica, sans-serif" font-size="18">Conversion Rate</text>
  <text x="870" y="318" fill="#132238" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">+18.2%</text>
  <text x="870" y="347" fill="#6f8297" font-family="Arial, Helvetica, sans-serif" font-size="16">vs recent baseline</text>

  <rect x="835" y="395" width="295" height="190" rx="22" fill="#102033" stroke="#335476" stroke-width="2"/>
  <text x="870" y="437" fill="#dce8f5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Automated Workflow</text>
  <rect x="870" y="465" width="76" height="44" rx="12" fill="#1d6f42"/>
  <text x="889" y="493" fill="#fff" font-family="Arial" font-size="17" font-weight="700">Excel</text>
  <path d="M955 487h31" stroke="#718aa4" stroke-width="4" stroke-linecap="round"/>
  <path d="M977 477l12 10-12 10" fill="none" stroke="#718aa4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="998" y="465" width="92" height="44" rx="12" fill="#3572a5"/>
  <text x="1014" y="493" fill="#fff" font-family="Arial" font-size="17" font-weight="700">Python</text>
  <text x="870" y="548" fill="#91a9c2" font-family="Arial, Helvetica, sans-serif" font-size="17">Detect → Explain → Log → Email</text>

  <rect x="70" y="610" width="150" height="34" rx="17" fill="#214d75"/>
  <text x="96" y="633" fill="#dcecff" font-family="Arial" font-size="15" font-weight="700">ANOMALY DETECTION</text>
  <rect x="235" y="610" width="110" height="34" rx="17" fill="#214d75"/>
  <text x="263" y="633" fill="#dcecff" font-family="Arial" font-size="15" font-weight="700">PYTHON</text>
  <rect x="360" y="610" width="96" height="34" rx="17" fill="#214d75"/>
  <text x="388" y="633" fill="#dcecff" font-family="Arial" font-size="15" font-weight="700">EXCEL</text>
  <rect x="471" y="610" width="124" height="34" rx="17" fill="#214d75"/>
  <text x="495" y="633" fill="#dcecff" font-family="Arial" font-size="15" font-weight="700">AUTOMATION</text>
</svg>
